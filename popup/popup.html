<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Folia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ── Header ── -->
  <header class="header">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M3 2.5C3 2.22386 3.22386 2 3.5 2H14.5C14.7761 2 15 2.22386 15 2.5V15.882C15 16.2607 14.572 16.4944 14.2764 16.2764L9 12.2915L3.7236 16.2764C3.42801 16.4944 3 16.2607 3 15.882V2.5Z" fill="#c9a96e"/>
      </svg>
      <span>Folia</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="openDashboardBtn" title="Open full dashboard">⊞</button>
      <button class="icon-btn" id="saveCurrentBtn" title="Save current tab">+</button>
      <button class="icon-btn" id="saveSecureBtn" title="Save to Secure Folder 🔐" style="background:#f59e0b22;color:#f59e0b;border-color:#f59e0b44">🔐</button>
    </div>
  </header>

  <!-- ── Current Tab Preview ── -->
  <div class="current-tab" id="currentTab">
    <div class="tab-favicon" id="tabFavicon">🌐</div>
    <div class="tab-info">
      <div class="tab-title" id="tabTitle">Loading…</div>
      <div class="tab-url"   id="tabUrl"></div>
    </div>

  </div>

  <!-- ── Search ── -->
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Search bookmarks…" />
  </div>

  <!-- ── Tabs ── -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="recent">Recent</button>
    <button class="tab-btn" data-tab="folders">Folders</button>
    <button class="tab-btn" data-tab="sources">Sources</button>
  </div>

  <!-- ── Content ── -->
  <div class="content" id="content">
    <!-- Filled by JS -->
  </div>

  <!-- ── Footer ── -->
  <div class="footer">
    <span id="totalCount">0 bookmarks</span>
    
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
